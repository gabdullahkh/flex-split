}

}

function today(){

 const lg=S.log[lk]||{s:[{},{}]},prev=previousSets(sl,i,nm,k),pl=S.log[(k-1)+'|'+sl+'|'+i],pr=exercisePR(nm),suggest=nextWeight(lg),rs=restSeconds(key,e[2]),deload=deloadAdvice(sl,k),doneCount=ty.filter((_,j)=>exerciseDone(k,sl,j)).length;
 const last=pl&&pl.nm===nm?pl.s.map(x=>x.w?x.w+S.units+'×'+(x.r||'?'):'–').join(' · '):'no data yet';

 <div class=exercise-strip>${ty.map((x,j)=>{const kk=tk+j,cc=(S.ca&&S.ca[kk])||[],aa=x[4].concat(cc),ss=+(S.sw[kk]||0),sel=ss&&aa[ss-1]?aa[ss-1]:[x[0],x[1]];return `<button class="${j===i?'active':''} ${exerciseDone(k,sl,j)?'done':''}" onclick="goExercise(${j})"><b>${j+1}</b><span class=ex-chip-label>${esc(shortExerciseLabel(sel[0],x[3]))}</span><small>${exerciseDone(k,sl,j)?'✓':'•'}</small></button>`}).join('')}</div>
 <div id=focusCard class="c focus-card" ontouchstart="swipeStart(event)" ontouchend="swipeEnd(event)">
   <div class=r><div><div class=focus-index>EXERCISE ${String(i+1).padStart(2,'0')}</div><b class=focus-title>${esc(nm)}</b></div><a class=watch href="${esc(a[1])}" target=_blank rel=noopener>Watch</a></div>
   <div class=mu>${e[3]} · Last: ${last}${pr?' · PR '+pr.w+S.units+'×'+(pr.r||'?'):''}</div>
   <div class="r rest-row"><span class=mu>Rest timer</span><select onchange="setRest('${key}',this.value)"><option value=60 ${rs===60?'selected':''}>1:00</option><option value=90 ${rs===90?'selected':''}>1:30</option><option value=105 ${rs===105?'selected':''}>1:45</option><option value=120 ${rs===120?'selected':''}>2:00</option><option value=150 ${rs===150?'selected':''}>2:30</option><option value=180 ${rs===180?'selected':''}>3:00</option><option value=240 ${rs===240?'selected':''}>4:00</option></select></div>
   <div class=set-head><span></span><span>${S.units.toUpperCase()}</span><span>REPS</span><span>RIR</span><span></span></div>
   ${[0,1].map(j=>{const s=lg.s[j]||{},pv=prev&&prev[j]?prev[j]:{},prNow=setBeatsPR(nm,s,lk),pid='pr_'+lk.replace(/\\|/g,'_')+'_'+j;return `<div class=set-wrap><div class=set><span class=mu>Set ${j+1}</span><input id="w_${j}" enterkeyhint=next inputmode=decimal placeholder="${pv.w||S.units}" value="${s.w||''}" oninput="sv('${lk}','${esc(nm)}',${j},'w',this.value);markPR('${lk}','${esc(nm)}',${j})" onkeydown="if(event.key==='Enter'){event.preventDefault();smartNext('r_${j}')}"><input id="r_${j}" enterkeyhint=next inputmode=numeric placeholder="${pv.r||'reps'}" value="${s.r||''}" oninput="sv('${lk}','${esc(nm)}',${j},'r',this.value);markPR('${lk}','${esc(nm)}',${j})" onkeydown="if(event.key==='Enter'){event.preventDefault();smartNext('i_${j}')}"><input id="i_${j}" enterkeyhint=done inputmode=numeric placeholder="RIR" value="${s.i||''}" oninput="sv('${lk}','${esc(nm)}',${j},'i',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();dn('${lk}','${esc(nm)}',${j},${rs})}"><button class="${s.d?'dn':''}" onclick="dn('${lk}','${esc(nm)}',${j},${rs})">✓</button></div><div id="${pid}" class=set-pr ${prNow?'':'hidden'}>★ New PR</div>${(!s.w||!s.r)&&pv&&(+pv.w||+pv.r)?`<div class=ghost-line>Previous: ${pv.w||'—'} ${S.units} × ${pv.r||'—'}</div>`:''}</div>`}).join('')}

   <div class=alt-row><select onchange="sw('${key}',this.value)"><option value=0 ${si?'':'selected'}>${esc(e[0])}</option>${alts.map((x,j)=>`<option value=${j+1} ${si==j+1?'selected':''}>${j<e[4].length?'Swap':'Custom'}: ${esc(x[0])}</option>`).join('')}</select><button class=alt-add onclick="ALT_EDIT=ALT_EDIT==='${key}'?'':'${key}';r()">＋</button></div>
   ${ALT_EDIT===key?`<div class=alt-editor><b>Add alternative</b><input id="an_${key}" placeholder="Exercise name"><input id="au_${key}" type=url inputmode=url placeholder="https://..."><div class=alt-actions><button class=p onclick="addAlt('${key}')">Save</button><button onclick="ALT_EDIT='';r()">Cancel</button></div></div>`:''}
 </div>
 <div class=focus-actions><button onclick="undoLast()" ${UNDO_STACK.length?'':'disabled'}>↶ Undo</button><button onclick="T='exs';r();scrollTo(0,0)">Edit exercises</button></div>
 <div class=c><textarea style="width:100%" rows=2 placeholder="Session note" oninput="S.notes[S.n]=this.value;save()">${esc(S.notes[n])}</textarea></div>
 <button class=p onclick=fin()>Finish session</button>`;
 return h;
}
function sv(lk,nm,j,f,v){const e=S.log[lk]=S.log[lk]||{nm,s:[{},{}]};e.nm=nm;e.s[j][f]=v;save()}
function dn(lk,nm,j,secs){pushUndo('set completion');sv(lk,nm,j,'d',!(S.log[lk]&&S.log[lk].s[j].d));const done=S.log[lk]&&S.log[lk].s[j].d;if(done)te=Date.now()+(+secs||105)*1e3;const parts=lk.split('|').map(Number),exDone=exerciseDone(parts[0],parts[1],parts[2]);if(exDone){const x=workoutCtx();if(CUR_EX<x.ty.length-1)CUR_EX++}r();if(!exDone&&done&&j===0)setTimeout(()=>smartNext('w_1'),0);scrollTo(0,0)}
function sw(k,v){S.sw[k]=+v;save();r()}
function addAlt(k){const name=($('an_'+k)?.value||'').trim(),url=($('au_'+k)?.value||'').trim();if(!name||!/^https?:\/\//i.test(url)){toast('Enter an exercise name and a valid link.');return}S.ca=S.ca||{};S.ca[k]=S.ca[k]||[];S.ca[k].push([name,url]);const base=k[0]==='U'?U:L,idx=+k.slice(1),defaults=(base[idx]&&base[idx][4]?base[idx][4].length:0);S.sw[k]=defaults+S.ca[k].length;ALT_EDIT='';save();r();toast('Alternative added.')}
function fin(){pushUndo('Finish Session');const t=iso(new Date()),n=S.n,sl=n%4,k=n/4|0;S.lastSummary=sessionSummary(k,sl);if(S.last!==t)S.run=S.last===ad(t,-1)?S.run+1:1;S.last=t;S.dates=S.dates||{};S.dates[S.n]=t;S.n++;S.hold='';save();CUR_EX=0;T='summary';r();scrollTo(0,0)}
function skip(){S.hold=ad(iso(new Date()),1);save();T='week';r()}
function move(d){S.hold=d;save();r()}

 <button class=p onclick="T='week';r();scrollTo(0,0)">View week</button><button style="width:100%;margin-top:10px" onclick="undoLast()">↶ Undo Finish Session</button><button style="width:100%;margin-top:10px" onclick="T='today';r();scrollTo(0,0)">Back to Today</button>`;
}

function week(){const t=iso(new Date()),st=ad(t,-((wd(t)+1)%7)),D=S.dates||{};
 let h='<div class=hero><div class=mu style="margin:0 0 5px">SCHEDULE</div><h2>This week</h2><p class=mu>Your current training days from Settings.</p></div>',k=0,run=0,mx=0;
 for(let i=0;i<14;i++){run=S.days.includes(wd(ad(st,i%7)))?run+1:0;mx=Math.max(mx,run)}
 for(let i=0;i<7;i++){const d=ad(st,i),on=S.days.includes(wd(d)),dn=Object.keys(D).some(n=>D[n]===d);
  h+=`<div class="c r" style="${d===t?'border-color:var(--ac)':''}"><div><b>${DN[wd(d)]}</b> <span class=mu>${d.slice(5)}${d===t?' · today':''}</span></div>${on?'<span>'+badge(k++%4)+(dn?' <span class=ok>✓ done</span>':'')+'</span>':'<span class=mu>Rest</span>'}</div>`}
 return h+(mx>3?'<p class=wr>4+ training days in a row. Leave a rest day in between.</p>':'')+(S.days.length<3?'<p class=wr>Aim for at least 3 days. 3 consistent beats 5 inconsistent.</p>':'')}

 ty.forEach((e,i)=>{const key=tk+i,custom=(S.ca&&S.ca[key])||[],alts=e[4].concat(custom),si=+(S.sw[key]||0),a=si&&alts[si-1]?alts[si-1]:[e[0],e[1]];

      </select>
      <button class=alt-add onclick="ALT_EDIT=ALT_EDIT==='${key}'?'':'${key}';r()" aria-label="Add custom alternative">＋</button>
    </div>
    ${ALT_EDIT===key?`<div class=alt-editor><b>Add custom alternative</b><input id="an_${key}" placeholder="Exercise name"><input id="au_${key}" type=url inputmode=url placeholder="https://... video or exercise link"><div class=alt-actions><button class=p onclick="addAlt('${key}')">Save</button><button onclick="ALT_EDIT='';r()">Cancel</button></div></div>`:''}
  </div>`;
 });

function best(e){return e&&e.s.filter(x=>+x.w).sort((a,b)=>b.w-a.w||b.r-a.r)[0]}
function prog(){const currentK=Math.max(0,(S.n-1)/4|0),vol=weeklyVolume(currentK);let h='<div class=hero><div class=mu style="margin:0 0 5px">PERFORMANCE</div><h2>Progress</h2><p class=mu>Compare each session with the same workout from last week.</p></div>';const vm=Object.entries(vol).sort((a,b)=>b[1]-a[1]);if(vm.length){const mx=Math.max(...vm.map(x=>x[1]));h+='<div class=c><div class=r><b>Volume by muscle</b><span class=mu>Week '+(currentK%8+1)+'</span></div><div class=volume-list>'+vm.map(([m,v])=>'<div class=volume-row><div class=r><span>'+esc(m)+'</span><b>'+Math.round(v).toLocaleString()+'</b></div><div class=volume-track><span style="width:'+Math.max(6,Math.round(v/mx*100))+'%"></span></div></div>').join('')+'</div></div>'}let any=0;
 for(let sl=0;sl<4;sl++){const ks=[...new Set(Object.keys(S.log).filter(x=>x.split('|')[1]==sl).map(x=>+x.split('|')[0]))].sort((a,b)=>b-a);if(!ks.length)continue;any=1;
  const c=ks[0],ty=sl%2?L:U;h+=`<div class=c><div class=r><b>${lab(sl)}</b><span class=mu>Week ${c%8+1}${ks.includes(c-1)?' vs '+((c-1)%8+1):''}</span></div>`;
  ty.forEach((e,i)=>{const a=S.log[c+'|'+sl+'|'+i],b=S.log[(c-1)+'|'+sl+'|'+i],x=best(a);if(!x)return;const z=best(b);let ar='',cl='mu';
   if(z&&b.nm===a.nm){const u=x.w>z.w||(x.w==z.w&&x.r>z.r),q=x.w==z.w&&x.r==z.r;ar=q?'▬':u?'▲':'▼';cl=q?'mu':u?'ok':'bad'}
   h+=`<div class=r style="margin-top:8px"><span>${esc(a.nm)}</span><span class=${cl}>${z&&b.nm===a.nm?z.w+'×'+z.r+' → ':''}${x.w}${S.units}×${x.r||'?'} ${ar}</span></div>`});h+='</div>'}
 return h+(any?'':'<div class=c>Log a session to see progress here.</div>')}

function prg(){const k=S.n/4|0,pw=k%8+1;return `<button class=back-btn onclick="T='more';r()">← More</button><div class=hero><div class=mu style="margin:0 0 5px">TRAINING PLAN</div><h2>Program</h2><p class=mu>Cycle ${(k/8|0)+1} · ${S.n} sessions done. After week 8 it repeats — weeks 1–2 act as a built-in deload.</p><div class=w>${[1,2,3,4,5,6,7,8].map(w=>`<div class=c style="text-align:center;${w==pw?'border-color:var(--ac)':''}"><b>W${w}</b><div class=mu>RIR ${w<3?'2–3':'1–2'}</div></div>`).join('')}</div><div class=c><b>Progression</b><p class=mu>Keep the same weight until you hit 10 reps on both sets. Then add the smallest increment. Reps may drop after an increase — normal. If everything stalls for 2+ weeks, check sleep and food first.</p></div>`}

function cfg(first){return `${first?'':'<button class=back-btn onclick="T=\'more\';r()">← More</button>'}<div class=hero><div class=mu style="margin:0 0 5px">${first?'WELCOME':'ACCOUNT & APP'}</div><h2>${first?'Set up Flex Split':'Settings'}</h2><p class=mu>${SB_OK?'Synced with Supabase.':'Saved on this device; Supabase sync unavailable.'}${USER?' · '+esc(USER.email):''}</p></div><div class=c><b>Days you can train</b><div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${[6,0,1,2,3,4,5].map(d=>`<button class="d ${S.days.includes(d)?'s':''}" onclick="td(${d})">${DN[d]}</button>`).join('')}</div>${S.days.length<3?'<div class=wr style="margin-top:8px">Aim for at least 3 days. 3 consistent beats 5 inconsistent.</div>':''}</div>
 <div class=c><div class=r>Units<select onchange="S.units=this.value;S.inc=this.value=='kg'?2.5:5;save();r()"><option ${S.units=='kg'?'selected':''}>kg</option><option ${S.units=='lb'?'selected':''}>lb</option></select></div>

const rows=()=>Object.keys(S.log).map(k=>{const[a,b,i]=k.split('|').map(Number);return{k:a,sl:b,i,e:S.log[k]}}).filter(x=>x.e.s.some(s=>s.w)).sort((p,q)=>p.k-q.k||p.sl-q.sl||p.i-q.i);
const fmt=s=>s&&s.w?s.w+'×'+(s.r||'?')+(s.i?' @'+s.i:''):'';

function cp(c){let o='Cycle\tWeek\tSession\tExercise\tSet 1\tSet 2\n';rows().forEach(x=>{if(c>=0&&(x.k/8|0)!=c)return;o+=[(x.k/8|0)+1,x.k%8+1,lab(x.sl),x.e.nm,fmt(x.e.s[0]),fmt(x.e.s[1])].join('\t')+'\n'});
 const f=()=>{CP=o;r();scrollTo(0,0)};try{navigator.clipboard.writeText(o).then(()=>toast('Copied. Paste into Google Sheets or Excel.'),f)}catch(e){f()}}
let CM=['',''];
const sl_=v=>{const[k,q]=v.split('|').map(Number);return `Cycle ${(k/8|0)+1} · Wk ${k%8+1} · ${lab(q)}`};
function cmp(){const back='<button class=back-btn onclick="T=\'more\';r()">← More</button>';const Q=[...new Set(rows().map(x=>x.k+'|'+x.sl))];if(Q.length<2)return back+'<div class=hero><div class=mu style="margin:0 0 5px">ANALYSIS</div><h2>Compare</h2><p class=mu>Compare two logged sessions side by side.</p></div><div class=c>Log at least two sessions to compare them.</div>';
 if(!Q.includes(CM[0])||!Q.includes(CM[1]))CM=[Q[Q.length-2],Q[Q.length-1]];
 const op=v=>Q.map(x=>`<option value="${x}" ${x==v?'selected':''}>${sl_(x)}</option>`).join('');
 const g=v=>{const o={};rows().filter(x=>x.k+'|'+x.sl==v).forEach(x=>o[x.e.nm]=best(x.e));return o};
 const A=g(CM[0]),B=g(CM[1]),ns=[...new Set([...Object.keys(A),...Object.keys(B)])],f=z=>z?z.w+'×'+(z.r||'?'):'—';
 return back+`<div class=hero><div class=mu style="margin:0 0 5px">ANALYSIS</div><h2>Compare</h2><p class=mu>Compare two logged sessions side by side.</p></div><div class=c><div class=r>A<select onchange="CM[0]=this.value;r()">${op(CM[0])}</select></div><div class=r style="margin-top:8px">B<select onchange="CM[1]=this.value;r()">${op(CM[1])}</select></div></div><div class=c style="overflow-x:auto"><table><tr><th>Exercise</th><th>A</th><th>B</th><th></th></tr>${ns.map(n=>{const a=A[n],b=B[n];let d='';if(a&&b){const u=b.w>a.w||(b.w==a.w&&b.r>a.r);d=b.w==a.w&&b.r==a.r?'▬':u?'<span class=ok>▲</span>':'<span class=bad>▼</span>'}return `<tr><td>${esc(n)}</td><td>${f(a)}</td><td>${f(b)}</td><td>${d}</td></tr>`}).join('')}</table></div><p class=mu>Best set per exercise. ▲ means B is better than A.</p>`}
function del(k){if(CF!==k){CF=k;r();return}delete S.log[k];CF='';save();r()}
function rst(){if(CF!=='rst'){CF='rst';r();return}try{localStorage.removeItem(userKey())}catch(e){}S=DEF();save();T='today';CF='';r()}
function toast(t){const e=document.createElement('div');e.className='c';e.style.cssText='position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));text-align:center;z-index:9';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
function r(){if(!AUTH_READY){$('nv').innerHTML='';$('app').innerHTML='<div class=c>Loading…</div>';return}if(!USER){$('nv').innerHTML='';$('app').innerHTML=authView();return}
 const meta={today:['Today','●'],exs:['Exercises','▤'],week:['Week','▦'],prog:['Progress','↗'],more:['More','•••']};
 const def=['today','exs','week','prog','more'];
 let order=(S.nav5||def).filter(x=>meta[x]);def.forEach(x=>{if(!order.includes(x))order.push(x)});
 const activeNav=T==='summary'?'today':(['cmp','prg','cfg'].includes(T)?'more':T);
 $('nv').innerHTML=S.setup?order.map(id=>`<button class="${activeNav==id?'on':''}" onclick="T='${id}';CF='';ALT_EDIT='';r();scrollTo(0,0)"><span class=ni>${meta[id][1]}</span><span>${meta[id][0]}</span></button>`).join(''):'';
 $('app').innerHTML=(CP?`<div class=c><b>Select all, then copy</b><textarea rows=8 style="width:100%" readonly onfocus="this.select()">${esc(CP)}</textarea><button onclick="CP='';r()">Close</button></div>`:'')+(!S.setup?cfg(1):{today,exs,week,prog,more,cmp,prg:()=>prg()+hist(),cfg,summary}[T]())}
$('tm').onclick=()=>{te=0};
setInterval(()=>{const e=$('tm');if(!te){e.hidden=1;return}const s=Math.ceil((te-Date.now())/1e3);if(s<=0){te=0;e.hidden=1;try{navigator.vibrate&&navigator.vibrate(300)}catch(x){}return}e.hidden=0;e.textContent='Rest '+(s/60|0)+':'+String(s%60).padStart(2,'0')+' · tap to skip'},500);
r();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=1').catch(()=>{}))}
</script></body></html>
